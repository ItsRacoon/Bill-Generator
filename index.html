<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Professional Bill Generator</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body>
    <div class="container">
        <header>
            <div class="header-content">
                <i class="fas fa-file-invoice-dollar"></i>
                <h1>Professional Bill Generator</h1>
                <div class="invoice-number">
                    Invoice #: <span id="invoice-number">INV-001</span>
                    <button type="button" id="generate-invoice-number" class="btn-small">
                        <i class="fas fa-refresh"></i>
                    </button>
                </div>
            </div>
        </header>

        <form id="bill-form">
            <!-- Business Information -->
            <section class="business-info">
                <h2><i class="fas fa-building"></i> Business Information</h2>
                <div class="form-row">
                    <div class="form-group">
                        <label for="business-name">Business Name:</label>
                        <input type="text" id="business-name" name="business-name" placeholder="Your Business Name">
                    </div>
                    <div class="form-group">
                        <label for="business-email">Business Email:</label>
                        <input type="email" id="business-email" name="business-email" placeholder="business@example.com">
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="business-address">Business Address:</label>
                        <textarea id="business-address" name="business-address" rows="2" placeholder="Your business address"></textarea>
                    </div>
                    <div class="form-group">
                        <label for="business-phone">Business Phone:</label>
                        <input type="tel" id="business-phone" name="business-phone" placeholder="+1 (555) 123-4567">
                    </div>
                </div>
            </section>

            <!-- Client Information -->
            <section class="client-info">
                <h2><i class="fas fa-user"></i> Client Information</h2>
                <div class="form-row">
                    <div class="form-group">
                        <label for="client-name">Client Name:</label>
                        <input type="text" id="client-name" name="client-name" required placeholder="Client's full name">
                    </div>
                    <div class="form-group">
                        <label for="client-email">Client Email:</label>
                        <input type="email" id="client-email" name="client-email" required placeholder="client@example.com">
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="client-address">Client Address:</label>
                        <textarea id="client-address" name="client-address" rows="3" required placeholder="Client's full address"></textarea>
                    </div>
                    <div class="form-group">
                        <label for="client-phone">Client Phone:</label>
                        <input type="tel" id="client-phone" name="client-phone" required placeholder="+1 (555) 987-6543">
                    </div>
                </div>
            </section>

            <!-- Bill Items -->
            <section class="bill-items">
                <h2><i class="fas fa-list"></i> Bill Items</h2>
                <div class="table-container">
                    <table id="items-table">
                        <thead>
                            <tr>
                                <th>Description</th>
                                <th>Qty</th>
                                <th>Unit Price (₹)</th>
                                <th>Total (₹)</th>
                                <th>Action</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr class="item-row">
                                <td><input type="text" name="description[]" required placeholder="Item description"></td>
                                <td><input type="number" name="quantity[]" min="1" value="1" required></td>
                                <td><input type="number" name="price[]" min="0" step="0.01" value="0.00" required></td>
                                <td class="item-total">₹0.00</td>
                                <td><button type="button" class="remove-item-btn" title="Remove Item"><i class="fas fa-trash"></i></button></td>
                            </tr>
                        </tbody>
                    </table>
                </div>
                <button type="button" class="add-item-btn">
                    <i class="fas fa-plus"></i> Add Item
                </button>
            </section>

            <!-- Bill Summary -->
            <section class="bill-summary">
                <h2><i class="fas fa-calculator"></i> Bill Summary</h2>
                <div class="summary-container">
                    <div class="summary-row">
                        <label for="discount-percent">Discount (%):</label>
                        <input type="number" id="discount-percent" min="0" max="100" step="0.01" value="0">
                    </div>
                    <div class="summary-row">
                        <label for="tax-percent">Tax (%):</label>
                        <input type="number" id="tax-percent" min="0" max="100" step="0.01" value="18">
                    </div>
                    
                    <div class="totals">
                        <div class="total-row">
                            <span>Subtotal:</span>
                            <span id="subtotal">₹0.00</span>
                        </div>
                        <div class="total-row discount-row">
                            <span>Discount:</span>
                            <span id="discount-amount">₹0.00</span>
                        </div>
                        <div class="total-row">
                            <span>After Discount:</span>
                            <span id="after-discount">₹0.00</span>
                        </div>
                        <div class="total-row">
                            <span>Tax:</span>
                            <span id="tax-amount">₹0.00</span>
                        </div>
                        <div class="total-row grand-total-row">
                            <span>Grand Total:</span>
                            <span id="grand-total">₹0.00</span>
                        </div>
                    </div>
                </div>
            </section>

            <!-- Additional Information -->
            <section class="additional-info">
                <h2><i class="fas fa-sticky-note"></i> Additional Information</h2>
                <div class="form-row">
                    <div class="form-group">
                        <label for="bill-date">Bill Date:</label>
                        <input type="date" id="bill-date" name="bill-date" required>
                    </div>
                    <div class="form-group">
                        <label for="due-date">Due Date:</label>
                        <input type="date" id="due-date" name="due-date">
                    </div>
                </div>
                <div class="form-group">
                    <label for="notes">Notes/Terms:</label>
                    <textarea id="notes" name="notes" rows="3" placeholder="Payment terms, notes, or special instructions..."></textarea>
                </div>
            </section>

            <!-- Submit Button -->
            <div class="form-actions">
                <button type="button" id="preview-btn" class="btn-secondary">
                    <i class="fas fa-eye"></i> Preview
                </button>
                <button type="submit" class="btn-primary">
                    <i class="fas fa-file-pdf"></i> Generate PDF
                </button>
                <button type="button" id="save-template-btn" class="btn-secondary">
                    <i class="fas fa-save"></i> Save Template
                </button>
            </div>
        </form>
    </div>

    <!-- Preview Modal -->
    <div id="preview-modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Bill Preview</h3>
                <span class="close">&times;</span>
            </div>
            <div class="modal-body" id="preview-content">
                <!-- Preview content will be inserted here -->
            </div>
        </div>
    </div>

    <!-- Load jsPDF and autoTable plugin -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.31/jspdf.plugin.autotable.min.js"></script>

    <!-- Your custom JavaScript file -->
    <script src="script.js"></script> 
</body>
</html>
